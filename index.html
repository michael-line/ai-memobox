<!DOCTYPE html>
<html lang="zh-TW" class="font-size-xl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 記憶夾</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#2563eb',
              dark: '#1d4ed8',
              light: '#eff6ff',
              accent: '#fff7ed',
              orangeText: '#c2410c',
              borderOrange: '#fed7aa'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 5 級距字體設定，保留後 3 個較大級距 (xl, 2xl, 3xl) */
    html.font-size-md { font-size: 15px; }
    html.font-size-lg { font-size: 17px; }
    html.font-size-xl { font-size: 19px; }
    html.font-size-2xl { font-size: 21px; }
    html.font-size-3xl { font-size: 23px; }

    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24 font-sans antialiased">

  <!-- 頂部精簡導航：已刪除「AI 記憶夾」字樣，僅保留後 3 個大字體按鈕與同步/設定 -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 py-2.5 flex items-center justify-between">
    <!-- 左側字體切換（保留後 3 個較大級距） -->
    <div class="flex items-center bg-slate-50 border border-slate-200/90 rounded-xl px-1 py-0.5 shadow-xs">
      <button onclick="setFontSize('xl')" id="btnFontXl" title="大字體" class="text-xs font-bold px-2 py-1 rounded-lg text-slate-500 hover:text-brand transition">A</button>
      <button onclick="setFontSize('2xl')" id="btnFont2xl" title="特大字體" class="text-xs font-bold px-2 py-1 rounded-lg text-slate-500 hover:text-brand transition">A+</button>
      <button onclick="setFontSize('3xl')" id="btnFont3xl" title="極大字體" class="text-xs font-bold px-2 py-1 rounded-lg text-slate-500 hover:text-brand transition">MAX</button>
    </div>

    <!-- 右側功能按鈕 -->
    <div class="flex items-center space-x-1">
      <button onclick="syncDataFromCloud()" id="btnSyncCloud" title="手動同步" class="p-2 text-slate-500 hover:text-brand rounded-xl hover:bg-slate-100 transition active:scale-95">
        <i class="fa-solid fa-arrows-rotate text-sm"></i>
      </button>
      <button onclick="openConfigModal()" title="設定" class="p-2 text-slate-500 hover:text-brand rounded-xl hover:bg-slate-100 transition active:scale-95">
        <i class="fa-solid fa-gear text-sm"></i>
      </button>
    </div>
  </header>

  <!-- 主內容區：已刪除問候語（晚安、家廣大...），直接進入搜尋與功能 -->
  <main class="max-w-md mx-auto px-4 pt-3 space-y-3">

    <!-- 智慧搜尋與 AI 檢索列 -->
    <div class="relative">
      <input type="text" id="aiSearchInput" onkeydown="if(event.key==='Enter') triggerSmartAISearch()" placeholder="搜尋記憶或問問 AI..." class="w-full bg-white border border-slate-200 rounded-2xl pl-10 pr-20 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent shadow-xs transition">
      <div class="absolute left-3.5 top-3.5 text-slate-400">
        <i class="fa-solid fa-magnifying-glass text-sm"></i>
      </div>
      <button onclick="triggerSmartAISearch()" class="absolute right-2 top-2 bg-brand hover:bg-brand-dark text-white px-3 py-1.5 rounded-xl text-xs font-medium transition active:scale-95 shadow-xs">
        檢索
      </button>
    </div>

    <!-- AI 直接回答卡片區 -->
    <div id="aiDirectAnswerWrapper" class="hidden bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 rounded-2xl p-3.5 shadow-xs transition">
      <div class="flex items-start gap-2">
        <div class="text-brand text-sm mt-0.5"><i class="fa-solid fa-sparkles"></i></div>
        <div class="flex-1">
          <div class="text-[11px] font-bold text-brand uppercase tracking-wider mb-0.5">AI 記憶回答</div>
          <div id="aiDirectAnswerText" class="text-xs text-slate-700 leading-relaxed font-medium"></div>
        </div>
      </div>
    </div>

    <!-- 添加記憶主按鈕 -->
    <button onclick="openAddModal()" class="w-full bg-brand hover:bg-brand-dark active:scale-[0.99] text-white py-3.5 rounded-2xl font-semibold text-base shadow-sm flex items-center justify-center gap-2 transition">
      <i class="fa-solid fa-plus text-sm"></i>
      <span>添加記憶</span>
    </button>

    <!-- 未分類橫幅 -->
    <div id="unclassifiedBanner" class="bg-brand-accent border border-brand-borderOrange rounded-2xl p-3.5 flex items-start justify-between gap-2 shadow-xs cursor-pointer" onclick="filterByCategory('未分類')">
      <div class="flex items-start gap-2.5">
        <div class="text-brand-orangeText text-lg mt-0.5">
          <i class="fa-regular fa-folder-open"></i>
        </div>
        <div>
          <h4 class="text-xs font-semibold text-brand-orangeText">有 <span id="unclassifiedCount">0</span> 筆資料還沒分類，點一下就能歸好</h4>
          <p class="text-[11px] text-brand-orangeText/80 mt-0.5">（點開卡片即可隨時修改所有內容）</p>
        </div>
      </div>
      <span class="text-xs text-brand-orangeText font-medium whitespace-nowrap mt-0.5 flex items-center gap-1">整理 <i class="fa-solid fa-arrow-right text-[10px]"></i></span>
    </div>

    <!-- 分類區 -->
    <div>
      <div class="flex items-center justify-between text-xs text-slate-500 mb-2.5 font-medium">
        <span class="text-slate-800 font-bold text-sm">文件分類</span>
        <button onclick="fetchNotesFromDrive()" class="hover:underline flex items-center gap-1 text-[11px]">最近新增 <i class="fa-solid fa-arrow-right text-[9px]"></i></button>
      </div>
      <div class="grid grid-cols-2 gap-2.5" id="categoryGrid">
        <div onclick="filterByCategory('財務')" class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-3 cursor-pointer hover:border-brand transition">
          <div class="text-2xl">💰</div>
          <div>
            <div class="text-xs font-bold text-slate-800">財務</div>
            <div class="text-[11px] text-slate-400 font-normal"><span id="count-財務">0</span> 筆</div>
          </div>
        </div>
        <div onclick="filterByCategory('工作')" class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-3 cursor-pointer hover:border-brand transition">
          <div class="text-2xl">💼</div>
          <div>
            <div class="text-xs font-bold text-slate-800">工作</div>
            <div class="text-[11px] text-slate-400 font-normal"><span id="count-工作">0</span> 筆</div>
          </div>
        </div>
        <div onclick="filterByCategory('旅行')" class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-3 cursor-pointer hover:border-brand transition">
          <div class="text-2xl">✈️</div>
          <div>
            <div class="text-xs font-bold text-slate-800">旅行</div>
            <div class="text-[11px] text-slate-400 font-normal"><span id="count-旅行">0</span> 筆</div>
          </div>
        </div>
        <div onclick="filterByCategory('醫療健康')" class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-3 cursor-pointer hover:border-brand transition">
          <div class="text-2xl">🏥</div>
          <div>
            <div class="text-xs font-bold text-slate-800">醫療健康</div>
            <div class="text-[11px] text-slate-400 font-normal"><span id="count-醫療健康">0</span> 筆</div>
          </div>
        </div>
        <div onclick="filterByCategory('證件')" class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-3 cursor-pointer hover:border-brand transition">
          <div class="text-2xl">🪪</div>
          <div>
            <div class="text-xs font-bold text-slate-800">證件</div>
            <div class="text-[11px] text-slate-400 font-normal"><span id="count-證件">0</span> 筆</div>
          </div>
        </div>
        <div onclick="filterByCategory('家庭生活')" class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-3 cursor-pointer hover:border-brand transition">
          <div class="text-2xl">🏡</div>
          <div>
            <div class="text-xs font-bold text-slate-800">家庭生活</div>
            <div class="text-[11px] text-slate-400 font-normal"><span id="count-家庭生活">0</span> 筆</div>
          </div>
        </div>
      </div>
    </div>
    <!-- 筆記卡片清單列表區 -->
    <div id="notesSection" class="pt-2">
      <div class="flex items-center justify-between mb-2">
        <h3 id="currentFilterTitle" class="text-sm font-bold text-slate-800">全部記憶</h3>
        <button onclick="showAllNotes()" class="text-xs text-brand hover:underline font-medium">重設篩選</button>
      </div>
      <div id="notesList" class="space-y-2.5">
        <!-- 動態渲染卡片 -->
      </div>
      <div id="emptyNotesState" class="hidden text-center py-10 bg-white rounded-2xl border border-slate-200/80">
        <i class="fa-regular fa-folder-open text-3xl text-slate-300 mb-2"></i>
        <p class="text-xs text-slate-400 font-medium">尚無相符的記憶內容</p>
      </div>
    </div>

  </main>

  <!-- 彈窗：新增/編輯記憶 Modal -->
  <div id="noteModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div class="bg-white w-full sm:max-w-lg max-h-[90vh] rounded-t-3xl sm:rounded-3xl p-5 overflow-y-auto flex flex-col gap-4 shadow-xl">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 id="modalTitle" class="text-base font-bold text-slate-800">新增記憶</h3>
        <button onclick="closeNoteModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-full"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">標題</label>
          <input type="text" id="formTitle" placeholder="例如：房屋稅繳納收據" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">分類</label>
          <select id="formCategory" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand bg-white">
            <option value="未分類">未分類</option>
            <option value="財務">財務</option>
            <option value="工作">工作</option>
            <option value="旅行">旅行</option>
            <option value="醫療健康">醫療健康</option>
            <option value="證件">證件</option>
            <option value="家庭生活">家庭生活</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">內容與備註</label>
          <textarea id="formContent" rows="4" placeholder="詳細內容..." class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">待辦 / 備忘項目</label>
          <input type="text" id="formTodo" placeholder="例如：記得下週一去銀行確認" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">提醒日期</label>
          <input type="date" id="formReminderDate" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand">
        </div>
      </div>

      <div class="flex items-center gap-2 pt-2 border-t mt-1">
        <button onclick="saveNote()" class="flex-1 bg-brand hover:bg-brand-dark text-white py-2.5 rounded-xl font-medium text-sm transition">儲存</button>
        <button onclick="closeNoteModal()" class="px-4 py-2.5 border border-slate-200 rounded-xl text-slate-600 font-medium text-sm hover:bg-slate-50 transition">取消</button>
      </div>
    </div>
  </div>

  <!-- 彈窗：系統設定 Modal (API Key & WebApp URL) -->
  <div id="configModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-xl space-y-4">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="text-sm font-bold text-slate-800">個人同步與 AI 設定</h3>
        <button onclick="closeConfigModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-base"></i></button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Google Apps Script WebApp URL</label>
          <input type="text" id="cfgGasUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-brand">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Gemini API Key</label>
          <input type="password" id="cfgGeminiKey" placeholder="貼上 AI Studio 取得的 API Key" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-brand">
        </div>
      </div>
      <button onclick="saveConfig()" class="w-full bg-brand text-white py-2.5 rounded-xl font-medium text-xs hover:bg-brand-dark transition">保存設定</button>
    </div>
  </div>

  <script>
    // 全域變數與儲存容器
    let allNotes = [];
    let currentEditId = null;

    // 初始化與字體設定（預設為 xl，支援 xl, 2xl, 3xl）
    window.addEventListener('DOMContentLoaded', () => {
      const savedFontSize = localStorage.getItem('MEMOBOX_FONT_SIZE') || 'xl';
      setFontSize(savedFontSize);
      loadLocalNotes();
      fetchNotesFromDrive();
    });

    function setFontSize(size) {
      const htmlEl = document.documentElement;
      htmlEl.classList.remove('font-size-md', 'font-size-lg', 'font-size-xl', 'font-size-2xl', 'font-size-3xl');
      htmlEl.classList.add(`font-size-${size}`);
      localStorage.setItem('MEMOBOX_FONT_SIZE', size);
      updateFontSizeButtonStyles(size);
    }

    function updateFontSizeButtonStyles(activeSize) {
      const sizes = [
        { key: 'xl', id: 'btnFontXl' },
        { key: '2xl', id: 'btnFont2xl' },
        { key: '3xl', id: 'btnFont3xl' }
      ];

      sizes.forEach(sz => {
        const btn = document.getElementById(sz.id);
        if (btn) {
          if (sz.key === activeSize) {
            btn.className = "text-xs font-bold px-2 py-1 rounded-lg bg-brand text-white shadow-xs transition";
          } else {
            btn.className = "text-xs font-bold px-2 py-1 rounded-lg text-slate-500 hover:text-brand transition";
          }
        }
      });
    }

    function openConfigModal() {
      document.getElementById('cfgGasUrl').value = localStorage.getItem('MEMOBOX_GAS_URL') || '';
      document.getElementById('cfgGeminiKey').value = localStorage.getItem('MEMOBOX_GEMINI_KEY') || '';
      document.getElementById('configModal').classList.remove('hidden');
    }

    function closeConfigModal() {
      document.getElementById('configModal').classList.add('hidden');
    }

    function saveConfig() {
      localStorage.setItem('MEMOBOX_GAS_URL', document.getElementById('cfgGasUrl').value.trim());
      localStorage.setItem('MEMOBOX_GEMINI_KEY', document.getElementById('cfgGeminiKey').value.trim());
      closeConfigModal();
      alert('設定已儲存！');
      fetchNotesFromDrive();
    }
    // 本地快取載入
    function loadLocalNotes() {
      try {
        const raw = localStorage.getItem('MEMOBOX_LOCAL_DATA');
        if (raw) {
          allNotes = JSON.parse(raw);
          updateCategoryCounts();
          renderNotesList(allNotes);
        }
      } catch (e) {
        console.error('本地讀取失敗:', e);
      }
    }

    // Google Apps Script 資料同步
    async function fetchNotesFromDrive() {
      const url = localStorage.getItem('MEMOBOX_GAS_URL');
      if (!url) return;

      const syncBtn = document.getElementById('btnSyncCloud');
      if (syncBtn) syncBtn.classList.add('animate-spin');

      try {
        const res = await fetch(url + '?action=getNotes');
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            allNotes = data;
            localStorage.setItem('MEMOBOX_LOCAL_DATA', JSON.stringify(data));
            updateCategoryCounts();
            renderNotesList(allNotes);
          }
        }
      } catch (err) {
        console.warn('雲端同步跳過或失敗:', err);
      } finally {
        if (syncBtn) syncBtn.classList.remove('animate-spin');
      }
    }

    function syncDataFromCloud() {
      fetchNotesFromDrive();
    }

    // 更新各分類計數
    function updateCategoryCounts() {
      const categories = ['財務', '工作', '旅行', '醫療健康', '證件', '家庭生活'];
      let unclassified = 0;
      const countMap = {};
      categories.forEach(c => countMap[c] = 0);

      allNotes.forEach(n => {
        const cat = (n['分類'] || '').trim();
        if (cat === '未分類' || !cat) {
          unclassified++;
        } else if (countMap[cat] !== undefined) {
          countMap[cat]++;
        }
      });

      document.getElementById('unclassifiedCount').innerText = unclassified;
      categories.forEach(c => {
        const el = document.getElementById(`count-${c}`);
        if (el) el.innerText = countMap[c] || 0;
      });
    }

    // 渲染卡片清單
    function renderNotesList(list) {
      const container = document.getElementById('notesList');
      const emptyState = document.getElementById('emptyNotesState');
      container.innerHTML = '';

      if (!list || list.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs hover:border-brand transition cursor-pointer flex flex-col gap-1.5";
        card.onclick = () => openEditModal(item);

        const categoryTag = item['分類'] ? `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-lg text-[11px] font-medium">${item['分類']}</span>` : '';
        const reminderTag = item['提醒日期'] ? `<span class="text-[11px] text-amber-600 font-medium"><i class="fa-regular fa-clock mr-1"></i>${item['提醒日期']}</span>` : '';

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <h4 class="text-sm font-bold text-slate-800">${item['標題'] || '無標題'}</h4>
            <div class="flex items-center gap-1.5">${categoryTag}${reminderTag}</div>
          </div>
          <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed">${item['摘要'] || item['原始內容'] || '尚無備註內容...'}</p>
        `;
        container.appendChild(card);
      });
    }

    function filterByCategory(cat) {
      document.getElementById('currentFilterTitle').innerText = `分類：${cat}`;
      if (cat === '未分類') {
        renderNotesList(allNotes.filter(n => !n['分類'] || n['分類'] === '未分類'));
      } else {
        renderNotesList(allNotes.filter(n => n['分類'] === cat));
      }
      window.scrollTo({ top: document.getElementById('notesSection').offsetTop - 60, behavior: 'smooth' });
    }

    function showAllNotes() {
      document.getElementById('currentFilterTitle').innerText = '全部記憶';
      document.getElementById('aiDirectAnswerWrapper').classList.add('hidden');
      document.getElementById('aiSearchInput').value = '';
      renderNotesList(allNotes);
    }

    // Modal 新增與編輯
    function openAddModal() {
      currentEditId = null;
      document.getElementById('modalTitle').innerText = '新增記憶';
      document.getElementById('formTitle').value = '';
      document.getElementById('formCategory').value = '未分類';
      document.getElementById('formContent').value = '';
      document.getElementById('formTodo').value = '';
      document.getElementById('formReminderDate').value = '';
      document.getElementById('noteModal').classList.remove('hidden');
    }

    function openEditModal(item) {
      currentEditId = item['ID'] || null;
      document.getElementById('modalTitle').innerText = '編輯記憶';
      document.getElementById('formTitle').value = item['標題'] || '';
      document.getElementById('formCategory').value = item['分類'] || '未分類';
      document.getElementById('formContent').value = item['原始內容'] || item['摘要'] || '';
      document.getElementById('formTodo').value = item['待辦清單'] || '';
      document.getElementById('formReminderDate').value = item['提醒日期'] || '';
      document.getElementById('noteModal').classList.remove('hidden');
    }

    function closeNoteModal() {
      document.getElementById('noteModal').classList.add('hidden');
    }

    function saveNote() {
      const title = document.getElementById('formTitle').value.trim();
      const category = document.getElementById('formCategory').value;
      const content = document.getElementById('formContent').value.trim();
      const todo = document.getElementById('formTodo').value.trim();
      const reminder = document.getElementById('formReminderDate').value;

      if (!title && !content) {
        alert('請填寫標題或內容！');
        return;
      }

      if (currentEditId) {
        const idx = allNotes.findIndex(n => String(n['ID']) === String(currentEditId));
        if (idx !== -1) {
          allNotes[idx]['標題'] = title;
          allNotes[idx]['分類'] = category;
          allNotes[idx]['原始內容'] = content;
          allNotes[idx]['摘要'] = content.slice(0, 50);
          allNotes[idx]['待辦清單'] = todo;
          allNotes[idx]['提醒日期'] = reminder;
        }
      } else {
        const newNote = {
          'ID': 'N_' + Date.now(),
          '標題': title || '新筆記',
          '分類': category,
          '原始內容': content,
          '摘要': content.slice(0, 50),
          '待辦清單': todo,
          '提醒日期': reminder
        };
        allNotes.unshift(newNote);
      }

      localStorage.setItem('MEMOBOX_LOCAL_DATA', JSON.stringify(allNotes));
      updateCategoryCounts();
      renderNotesList(allNotes);
      closeNoteModal();
    }

    // 強化版語意搜尋（自動降級，避免出錯中斷）
    async function triggerSmartAISearch(customQuery) {
      const q = (customQuery || document.getElementById('aiSearchInput').value || '').trim();
      if (!q) {
        showAllNotes();
        return;
      }

      const apiKey = localStorage.getItem('MEMOBOX_GEMINI_KEY');
      const answerWrapper = document.getElementById('aiDirectAnswerWrapper');
      const answerText = document.getElementById('aiDirectAnswerText');
      const titleEl = document.getElementById('currentFilterTitle');

      titleEl.innerText = `AI 正在檢索：「${q}」...`;
      answerWrapper.classList.add('hidden');

      let aiSuccess = false;

      if (apiKey && allNotes.length > 0) {
        try {
          const notesContext = allNotes.slice(0, 30).map(n =>
            `[ID: ${n['ID']}] 標題: ${n['標題'] || ''} | 分類: ${n['分類'] || ''} | 摘要: ${n['摘要'] || ''} | 待辦: ${n['待辦清單'] || ''}`
          ).join('\n');

          const prompt = `你是一個個人的第二大腦記憶庫管理員。使用者提問：「${q}」。\n以下是記憶庫中現有的資料：\n${notesContext}\n\n請根據使用者的問題，完成兩件事：\n1. 用親切繁體中文直接回答使用者的問題（25字以內）。\n2. 列出與該問題最相關的筆記 [ID] 清單。\n請務必嚴格回傳純 JSON 格式，不要加任何其他文字：\n{"answer": "一句話直接回答", "matched_ids": ["ID字串"]}`;

          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const data = await res.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error("JSON 解析失敗");

          const aiResult = JSON.parse(jsonMatch[0]);

          if (aiResult.answer) {
            answerText.innerText = aiResult.answer;
            answerWrapper.classList.remove('hidden');
          }

          if (Array.isArray(aiResult.matched_ids) && aiResult.matched_ids.length > 0) {
            const matchedNotes = allNotes.filter(n => aiResult.matched_ids.includes(String(n['ID'])));
            if (matchedNotes.length > 0) {
              titleEl.innerText = `AI 語意搜尋：「${q}」（找到 ${matchedNotes.length} 筆相關）`;
              renderNotesList(matchedNotes);
              window.scrollTo({ top: document.getElementById('notesSection').offsetTop - 60, behavior: 'smooth' });
              aiSuccess = true;
              return;
            }
          }
        } catch (err) {
          console.warn("Gemini 呼叫失敗，降級為關鍵字比對:", err);
        }
      }

      if (!aiSuccess) {
        const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
        const filtered = allNotes.filter(n => {
          const fullContent = [
            n['標題'], n['摘要'], n['分類'], n['標籤'],
            n['待辦清單'], n['原始內容'], n['提醒日期']
          ].join(' ').toLowerCase();
          return tokens.some(tok => fullContent.includes(tok));
        });

        titleEl.innerText = `搜尋結果：「${q}」（找到 ${filtered.length} 筆）`;
        renderNotesList(filtered);
        window.scrollTo({ top: document.getElementById('notesSection').offsetTop - 60, behavior: 'smooth' });
      }
    }
  </script>
